<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Header -->
        <header class="glass-panel header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <h1>Algorithmic Scalper</h1>
            </div>
            
            <div class="status-indicator">
                <span class="pulse-dot" id="status-dot"></span>
                <span id="status-text" class="status-text">Desconectado</span>
            </div>
        </header>

        <!-- Main Bento Grid -->
        <main class="bento-grid">
            
            <!-- Control Panel -->
            <section class="glass-panel control-panel">
                <h2>Control de Ejecución</h2>
                <p class="subtitle">Activa o detén el motor de trading en tiempo real.</p>
                
                <button id="toggle-bot-btn" class="btn btn-start">
                    <span class="btn-text">INICIAR BOT</span>
                    <span class="btn-loader loader-hidden"></span>
                </button>
            </section>

            <!-- Stats Panel (Para Fases futuras) -->
            <section class="glass-panel stats-panel">
                <h2>Resumen de Cuenta (Paper Trading)</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Balance Actual</span>
                        <span class="stat-value" id="balance-val">100.00 USDT</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">PNL Hoy</span>
                        <span class="stat-value neutral" id="pnl-val">0.00%</span>
                    </div>
                </div>
            </section>

            <!-- Holographic Terminal Placeholder (Para el Prompt 04) -->
            <section class="glass-panel terminal-panel" id="terminal-container">
                <div class="terminal-header">
                    <h3>Terminal de Logs</h3>
                    <div class="terminal-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
                <div class="terminal-body" id="logs-output">
                    <div class="log-line text-muted">> Esperando conexión SSE...</div>
                    <div class="log-line text-muted">> El módulo de logs se implementará en la Fase 4.</div>
                </div>
            </section>

        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
